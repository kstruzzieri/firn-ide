name: Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.Codex/**'
      - '.claude/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.Codex/**'
      - '.claude/**'

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Build frontend (required for go:embed)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run tests
        run: go test ./... -v

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  # No "Build frontend" step here, unlike backend-tests: these three packages are
  # leaves and none of them reaches main's `go:embed all:frontend/dist`. If that
  # ever changes this job fails with an embed error that reads like a bad
  # checkout — add the frontend build step rather than chasing the symptom.
  windows-filesystem-tests:
    name: Windows Filesystem Tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      # -v is load-bearing: several security tests skip when Windows withholds
      # SeCreateSymbolicLinkPrivilege, and without -v a fully skipped suite is
      # indistinguishable from a passing one.
      - name: Run filesystem, run history and workspace tests
        run: go test -v ./internal/filesystem ./internal/runhistory ./internal/workspace
