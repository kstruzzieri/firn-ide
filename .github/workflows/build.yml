name: Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.Codex/**'
      - '.claude/**'
  # No `branches:` filter: that filter matches the PR's BASE branch, so scoping
  # it to [main, develop] gave stacked PRs (base = another feature branch) zero
  # checks and a mergeable "no checks reported" state. The narrow `push` filter
  # above is what keeps this from double-running on feature-branch pushes.
  # No `paths-ignore` either: branch protection requires these checks, and a
  # filtered-out PR never reports them -- it would sit "Expected" forever and
  # be unmergeable. Docs-only PRs pay one short CI run instead.
  pull_request:

jobs:
  build:
    name: Build Verification
    # Pinned to 22.04: the image IS the WebKit2GTK 4.1 compatibility floor.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Linux dependencies for Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build application
        run: wails3 task linux:build ARCH=amd64

      - name: Verify build output
        run: test -f bin/firn
